<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Incidents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 450px;
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex align-items-center px-3 py-2 border-bottom bg-white">
    <h6 class="mb-0 fw-bold flex-grow-1">Active Incident</h6>
  </div>

  <div class="container mt-3">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const lat = parseFloat(localStorage.getItem('emergencyLat'));
    const lng = parseFloat(localStorage.getItem('emergencyLng'));

    console.log("Map Latitude:", lat);
    console.log("Map Longitude:", lng);

    if (!isNaN(lat) && !isNaN(lng)) {
      const map = L.map('map').setView([lat, lng], 16); // Zoom level 16 is street-level

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      L.marker([lat, lng]).addTo(map)
        .bindPopup("🚨 Emergency reported here")
        .openPopup();
    } else {
      document.getElementById('map').innerHTML = "<p class='text-danger'>Invalid coordinates. Please trigger an emergency again.</p>";
    }
  </script>
</body>
</html>
