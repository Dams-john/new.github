<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Help App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
      position: relative;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-arrow, .notification { font-size: 20px; cursor: pointer; }
    .notification::after {
      content: ''; position: absolute; top: -2px; right: -2px;
      width: 8px; height: 8px; background: red; border-radius: 50%;
    }
    .greeting { text-align: left; margin: 20px 0 10px; font-size: 14px; }
    .greeting b { font-size: 16px; }
    .help-text { font-size: 14px; margin-bottom: 8px; }
    .circle-button-wrapper {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
    }
    .circle-button {
      width: 250px; height: 250px; border-radius: 50%;
      background: radial-gradient(circle at center, #2d2626 0%, #595151 85%);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .circle-button::before, .circle-button::after {
      content: ''; position: absolute; border-radius: 50%;
    }
    .circle-button::before { width: 270px; height: 270px; background: rgba(0, 0, 0, 0.1); z-index: -2; }
    .circle-button::after { width: 290px; height: 290px; background: rgba(0, 0, 0, 0.05); z-index: -3; }
    .icon { color: #f2f2f2; font-size: 40px; }
    @media (max-width: 400px) {
      .circle-button { width: 200px; height: 200px; }
      .circle-button::before { width: 220px; height: 220px; }
      .circle-button::after { width: 240px; height: 240px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="back-arrow">&#8592;</div>
    <div class="title">Home</div>
    <div class="notification">&#128276;</div>
  </header>

  <div class="greeting">
    Hi!<br /><b>Ruqie</b>
  </div>
  <div class="help-text">
    Help is just a click away!<br />
    <strong>Click 🚨 to call help</strong>
  </div>

  <div class="circle-button-wrapper">
    <div class="circle-button" id="pulseCircle" onclick="triggerEmergency()">
      <div class="icon">🚨</div>
    </div>
  </div>

  <script>
    const pulseCircle = document.getElementById('pulseCircle');
    let scale = 1;
    let growing = true;
    function animateCircle() {
      scale = growing ? scale + 0.01 : scale - 0.01;
      if (scale >= 1.05) growing = false;
      if (scale <= 0.95) growing = true;
      pulseCircle.style.transform = `scale(${scale})`;
      requestAnimationFrame(animateCircle);
    }
    animateCircle();

function triggerEmergency() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      // Save to localStorage to use on next page
      localStorage.setItem('emergencyLat', lat);
      localStorage.setItem('emergencyLng', lng);

      // Send to PHP for database logging (optional)
      const response = await fetch('trigger_emergency.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `lat=${lat}&lng=${lng}`
      });

      if (response.ok) {
        window.location.href = 'active.html';
      } else {
        alert("Emergency trigger failed");
      }
    });
  } else {
    alert("Geolocation not supported");
  }
}

  </script>
</body>
</html>
